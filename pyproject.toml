[project]
name = "boltz2-app-local"
version = "0.1.0"
description = "Streamlit host UI that runs Boltz-2 in Docker"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.43.0",
  "numpy>=1.26.0",
  "matplotlib>=3.8.0",
]

[project.scripts]
boltzapp = "boltz2_app_local.cli:main"
boltz-app = "boltz2_app_local.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["boltz2_app_local"]

[tool.streamlit]
# Placeholder table so repo has a canonical TOML root for tooling.
